name: Prepare public viewer

on:
  push:
    branches: [main, feat/conic-contact-validation]
    paths:
      - 'web/**'
      - 'tools/export_public_viewer.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: python3 tools/export_public_viewer.py outputs/public-viewer
      - uses: actions/upload-artifact@v4
        with:
          name: public-viewer
          path: outputs/public-viewer/site
          include-hidden-files: true
