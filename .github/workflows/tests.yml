name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,simulation,conic]"
      - run: python tools/fetch_panda_meshes.py
      - run: python tools/fetch_robotiq_assets.py
      - run: python tools/fetch_rb5_meshes.py
      - run: python tools/fetch_rby1_assets.py
      - run: python -m pytest -q
      - run: contact-transfer demo-refinement
      - run: python examples/dual_arm_keyframe.py
      - run: python examples/fixed_wrench_margin.py
      - run: python examples/three_arm_contracted.py
      - run: python tools/benchmark_cito_solvers.py --repeats 1
      - run: contact-transfer demo-control franka_panda --seconds 1.4
      - run: python -m build
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web test
