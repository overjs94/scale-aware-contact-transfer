[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-aware-contact-transfer"
version = "0.1.0"
description = "URDF-driven rigid-body models and contact-transfer optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "casadi>=3.7,<4", "pin>=3.4,<5"]

[project.optional-dependencies]
simulation = ["mujoco>=3.3,<5"]
conic = ["clarabel>=0.10,<1"]
model-tools = ["xacro>=2.1,<3"]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
contact-transfer = "contact_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contact_transfer = ["models/**/*.urdf", "models/**/*.json", "models/**/LICENSE*", "scenarios/**/*.urdf", "scenarios/**/*.json", "scenarios/**/*.srdf", "scenarios/**/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
